const LV=[
 {cols:[3,3,3,3,5,3,3,3,5,3,3,3],barrels:[[3,0],[8,0]],knights:[1,4,8,10],shots:7,fire:2},
 {cols:[4,4,6,4,4,4,7,4,4,4,6,4,4,4],barrels:[[3,1],[6,0],[9,0],[12,1]],knights:[2,6,10,5],shots:8,fire:3},
 {cols:[5,5,8,5,5,5,5,9,5,5,5,5,8,5,5,5],barrels:[[3,0],[6,1],[7,0],[10,1],[13,0]],knights:[2,7,12,4,10],shots:9,fire:3}
];
let level=0,gold=250,shots,fire,ammo='stone',blocks=[],parts=[],pend=[],proj=null,state='aim',total=1,wait=0,shake=0,drag=null,arm={x:.7,y:.7},armT={x:.7,y:.7},armHold=0,bonus=0;
function mk(t,x,y){const h=t==='wall'?3:1;return{t,x,y,vy:0,hp:h,max:h}}
function load(n){const L=LV[n];blocks=[];parts=[];pend=[];proj=null;
 L.cols.forEach((h,i)=>{for(let r=0;r<h;r++)blocks.push(mk('wall',X0+i*B,G-(r+1)*B))});
 L.barrels.forEach(([c,r])=>{const b=blocks.find(b=>b.x===X0+c*B&&b.y===G-(r+1)*B);if(b){b.t='barrel';b.hp=b.max=1}});
 L.knights.forEach(c=>blocks.push(mk('knight',X0+c*B,G-(L.cols[c]+1)*B)));
 total=blocks.length;shots=L.shots;fire=L.fire;ammo='stone';state='aim';bonus=0;ui()}
function ui(){document.getElementById('bF').textContent='🔥 Ateş ('+fire+') (2)';
 document.getElementById('bS').className=ammo==='stone'?'on':'';document.getElementById('bF').className=ammo==='fire'?'on':''}
function setAmmo(a){if(a==='fire'&&fire<=0)return;ammo=a;ui()}
document.getElementById('bS').onclick=()=>setAmmo('stone');
document.getElementById('bF').onclick=()=>setAmmo('fire');
addEventListener('keydown',e=>{if(e.key==='1')setAmmo('stone');if(e.key==='2')setAmmo('fire')});
function fx(x,y,R){for(let i=0;i<R/3;i++){const a=Math.random()*6.28,s=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:.2,l:40,m:40,c:i%2?'#8a8a90':'#c77b30',s:3+Math.random()*3})}
 for(let i=0;i<R/8;i++)parts.push({x:x+(Math.random()-.5)*R*.6,y:y+(Math.random()-.5)*R*.4,vx:(Math.random()-.5),vy:-.6-Math.random(),g:0,l:50,m:50,c:'rgba(110,110,110,',s:8+Math.random()*10,sm:1});
 parts.push({x,y,l:12,m:12,fl:1,R})}
function destroy(b){const i=blocks.indexOf(b);if(i<0)return;blocks.splice(i,1);
 gold+=b.t==='knight'?25:b.t==='barrel'?10:5;
 for(let k=0;k<4;k++)parts.push({x:b.x+B/2,y:b.y+B/2,vx:(Math.random()-.5)*4,vy:-Math.random()*3,g:.25,l:35,m:35,c:b.t==='knight'?'#5b7fb0':'#8a8a90',s:3+Math.random()*3});
 if(b.t==='barrel')pend.push({t:7,x:b.x+B/2,y:b.y+B/2})}
function explode(x,y,R,hi,lo){shake=Math.max(shake,R/6);const dead=[];
 for(const b of blocks){const d=Math.hypot(b.x+B/2-x,b.y+B/2-y);if(d<R+B/2){b.hp-=d<R*.6?hi:lo;if(b.hp<=0)dead.push(b)}}
 dead.forEach(destroy);fx(x,y,R)}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function pull(p){let dx=p.x-PX,dy=p.y-PY,l=Math.hypot(dx,dy)||1;const c=Math.min(l,110);dx=dx/l*c;dy=dy/l*c;return{dx,dy,l:c}}
cv.addEventListener('pointerdown',e=>{
 if(state==='win'){if(level<LV.length-1){level++;load(level)}else state='end';return}
 if(state==='lose'){load(level);return}
 if(state==='end'){level=0;gold=250;load(0);return}
 if(state==='aim'){drag=pos(e);cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(drag)drag=pos(e)});
cv.addEventListener('pointerup',()=>{if(!drag||state!=='aim'){drag=null;return}
 const q=pull(drag);drag=null;if(q.l<18)return;
 const f=ammo==='fire';proj={x:PX,y:PY,vx:-q.dx*.15,vy:-q.dy*.15,fire:f};shots--;if(f){fire--;if(fire<=0)ammo='stone'}
 const m=Math.hypot(q.dx,q.dy);armT={x:-q.dx/m,y:-q.dy/m};armHold=12;state='fly';ui()});
function hit(){const f=proj.fire;explode(proj.x,proj.y,f?70:36,f?3:2,f?2:1);proj=null;state='settle';wait=45}
function update(){
 blocks.sort((a,b)=>b.y-a.y);
 for(const b of blocks){let fl=G;for(const o of blocks)if(o!==b&&o.x===b.x&&o.y>b.y&&o.y<fl)fl=o.y;
  if(b.y+B<fl-.1){b.vy+=GR*1.2;b.y+=b.vy;if(b.y+B>=fl){b.y=fl-B;b.vy=0}}else{b.y=fl-B;b.vy=0}}
 for(let i=pend.length-1;i>=0;i--){const p=pend[i];if(--p.t<=0){pend.splice(i,1);explode(p.x,p.y,100,3,2)}}
 if(proj){const p=proj;p.vy+=GR;
  parts.push({x:p.x,y:p.y,vx:0,vy:0,g:0,l:14,m:14,c:p.fire?'rgba(255,150,40,':'rgba(200,200,200,',s:p.fire?6:3,sm:1});
  loop:for(let i=0;i<3;i++){p.x+=p.vx/3;p.y+=p.vy/3;
   for(const b of blocks)if(p.x>b.x-6&&p.x<b.x+B+6&&p.y>b.y-6&&p.y<b.y+B+6){hit();break loop}
   if(p.y>=G-4){hit();break}}
  if(proj&&(p.x<-60||p.x>W+60)){proj=null;state='settle';wait=30}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];if(!p.fl){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g}if(--p.l<=0)parts.splice(i,1)}
 if(state==='settle'){wait--;if(wait<=0&&!pend.length&&blocks.every(b=>b.vy===0)){
  if(blocks.length<=total*.15){bonus=shots*20;gold+=bonus;state='win'}
  else if(shots<=0)state='lose';else state='aim'}}
 if(armHold>0){armHold--;if(!armHold)armT={x:.7,y:.7}}
 const t=(state==='aim'&&drag)?(()=>{const q=pull(drag),m=q.l||1;return{x:q.dx/m,y:q.dy/m}})():armT;
 arm.x+=(t.x-arm.x)*.3;arm.y+=(t.y-arm.y)*.3;shake*=.88}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBlock(b){const {x,y}=b;
 if(b.t==='barrel'){if(bimg.complete&&bimg.naturalWidth)ctx.drawImage(bimg,x+1,y-3,B-2,B+3);else{ctx.fillStyle='#8a4b22';ctx.fillRect(x+2,y,B-4,B)}return}
 if(b.t==='knight'){ctx.fillStyle='#5b7fb0';ctx.fillRect(x+7,y+11,12,13);ctx.fillStyle='#c9d3de';ctx.beginPath();ctx.arc(x+13,y+8,6,0,6.28);ctx.fill();
  ctx.fillStyle='#d33';ctx.fillRect(x+12,y,2,4);ctx.fillStyle='#8a5a2b';ctx.fillRect(x+19,y+8,2,15);return}
 const d=b.hp/b.max;ctx.fillStyle=d>.66?'#a3a3a8':d>.33?'#8b8b90':'#727278';ctx.fillRect(x,y,B,B);
 ctx.strokeStyle='#4a4a52';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,B-2,B-2);
 ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+B/2);ctx.lineTo(x+B,y+B/2);ctx.moveTo(x+B/2,y);ctx.lineTo(x+B/2,y+B/2);ctx.stroke();
 if(d<1){ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(x+4,y+3);ctx.lineTo(x+12,y+13);ctx.lineTo(x+8,y+22);ctx.stroke()}}
function panel(x,y,w,t){ctx.fillStyle='#6b4423';rr(x,y,w,34,6);ctx.fill();ctx.strokeStyle='#3a2410';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#fff4d6';ctx.font='bold 16px Trebuchet MS,Verdana,sans-serif';ctx.textAlign='left';ctx.fillText(t,x+12,y+23)}
function msg(a,b){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.font='bold 54px Trebuchet MS,Verdana,sans-serif';ctx.fillText(a,W/2,H/2-10);
 ctx.fillStyle='#fff4d6';ctx.font='bold 22px Trebuchet MS,Verdana,sans-serif';ctx.fillText(b,W/2,H/2+34)}
function draw(){
 ctx.save();if(shake>.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#1c5a26');g.addColorStop(1,'#14461b');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
 for(const [tx,ty] of [[500,380],[560,300],[620,420],[430,430],[690,340],[750,260]]){ctx.fillStyle='#0f3a16';ctx.beginPath();ctx.moveTo(tx,ty-50);ctx.lineTo(tx-20,ty);ctx.lineTo(tx+20,ty);ctx.fill();ctx.fillStyle='#5a3a1e';ctx.fillRect(tx-3,ty,6,10)}
 ctx.fillStyle='#4fa83a';ctx.beginPath();ctx.ellipse(X0+LV[level].cols.length*B/2,G,LV[level].cols.length*B/2+50,38,0,Math.PI,0);ctx.fill();
 ctx.fillStyle='#3f9a35';ctx.fillRect(0,G,W,14);ctx.fillStyle='#7a5230';ctx.fillRect(0,G+14,W,H-G);
 for(const b of blocks)drawBlock(b);
 // catapult
 ctx.fillStyle='#5a3a1e';ctx.strokeStyle='#2a180a';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(CX-48,G-14);ctx.lineTo(CX-14,G-46);ctx.lineTo(CX+14,G-46);ctx.lineTo(CX+48,G-14);ctx.closePath();ctx.fill();ctx.stroke();
 const m=Math.hypot(arm.x,arm.y)||1,tx=PX+arm.x/m*72,ty=PY+arm.y/m*72;
 ctx.strokeStyle='#8a5a2b';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(PX,PY);ctx.lineTo(tx,ty);ctx.stroke();
 ctx.fillStyle='#4a2f16';ctx.beginPath();ctx.arc(tx,ty,10,0,6.28);ctx.fill();
 if(state==='aim'&&!drag||drag&&state==='aim'){ctx.fillStyle=ammo==='fire'?'#ff9a2a':'#9a9aa0';ctx.beginPath();ctx.arc(tx,ty-4,7,0,6.28);ctx.fill()}
 for(const x of [CX-26,CX+26]){ctx.fillStyle='#6b4423';ctx.beginPath();ctx.arc(x,G-14,15,0,6.28);ctx.fill();ctx.strokeStyle='#2a180a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#2a180a';ctx.beginPath();ctx.arc(x,G-14,4,0,6.28);ctx.fill()}
 if(proj){ctx.fillStyle=proj.fire?'#ff7a1a':'#8f8f95';ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(proj.x,proj.y,8,0,6.28);ctx.fill();ctx.stroke()}
 for(const p of parts){if(p.fl){const k=1-p.l/p.m;ctx.fillStyle='rgba(255,200,80,'+(1-k)*.8+')';ctx.beginPath();ctx.arc(p.x,p.y,p.R*(.3+k*.7),0,6.28);ctx.fill()}
  else if(p.sm){ctx.fillStyle=p.c+(p.l/p.m*.5)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1.5-p.l/p.m),0,6.28);ctx.fill()}
  else{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}}
 if(drag&&state==='aim'){const q=pull(drag);let x=PX,y=PY,vx=-q.dx*.15,vy=-q.dy*.15;ctx.fillStyle='rgba(255,244,214,.8)';
  for(let i=0;i<70&&y<G;i++){vy+=GR;x+=vx;y+=vy;if(i%3===0){ctx.beginPath();ctx.arc(x,y,2.5,0,6.28);ctx.fill()}}
  ctx.fillStyle='rgba(255,210,63,.9)';ctx.fillRect(PX-60,H-30,120*q.l/110,8)}
 ctx.restore();
 panel(10,10,170,'ALTIN: '+gold);panel(10,50,170,'MERMİ: '+shots);panel(10,90,170,'SEVİYE: '+(level+1)+'/'+LV.length);
 ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.strokeStyle='#3a2410';ctx.lineWidth=6;ctx.font='bold 34px Trebuchet MS,Verdana,sans-serif';ctx.strokeText('MANCINIK KUŞATMASI',W/2+40,40);ctx.fillText('MANCINIK KUŞATMASI',W/2+40,40);
 const left=Math.max(0,(blocks.length-total*.15)/(total*.85));ctx.fillStyle='#3a2410';rr(W/2-60,54,200,16,6);ctx.fill();ctx.fillStyle='#d33';rr(W/2-58,56,196*left,12,5);ctx.fill();
 if(state==='win')msg('ZAFER!','Kale yıkıldı +'+bonus+' altın bonus. Devam için dokun');
 if(state==='lose')msg('KALE AYAKTA','Mermin bitti. Tekrar denemek için dokun');
 if(state==='end')msg('FETİH TAMAM!','Toplam altın: '+gold+'. Baştan başlamak için dokun')}
let last=performance.now(),acc=0;
function frame(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(frame)}
load(0);requestAnimationFrame(frame);
</script></body></html>
